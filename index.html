<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Shooter Game</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <div id="hub">

        <div class="box">
            Health:
            <span id=" health">100</span>
        </div>

        <div class="box">
            Score:
            <span id="score">0</span>
        </div>

        <div class="box">
            Enemies:
            <span id="enemyCount">0</span>
        </div>

    </div>

    <!-- Game Over -->

    <div id="gameOver">

        <h1>GAME OVER</h1>

        <p>Your ship was destroyed.</p>

        <button id="restartBtn">
            Play Again
        </button>

    </div>

    <!-- CANVAS -->

    <canvas id="gameCanvas"></canvas>

    <script src="script.js"></script>

</body>
</html>
